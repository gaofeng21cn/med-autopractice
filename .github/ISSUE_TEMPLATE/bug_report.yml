name: Bug report
description: Report a reproducible issue using synthetic or public inputs.
title: "bug: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest synthetic or public reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I used only synthetic or public data and did not include hospital, patient, credential, or deployment details.
          required: true
