name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            release-check: 'false'
          - os: ubuntu-latest
            python-version: '3.11'
            release-check: 'false'
          - os: ubuntu-latest
            python-version: '3.12'
            release-check: 'true'
          - os: macos-latest
            python-version: '3.12'
            release-check: 'false'
          - os: windows-latest
            python-version: '3.12'
            release-check: 'false'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public release boundary
        if: matrix.release-check == 'true'
        run: python scripts/public_release_check.py
      - name: Verify package metadata
        run: python scripts/package_metadata.py
      - name: Inspect project
        run: python scripts/project_status.py --json
      - name: Inspect generic site plan
        run: python scripts/site_plan.py revise_orders
      - name: Run the custom proposer example
        run: python examples/synthetic/custom_proposer.py
      - name: Run the loopback FHIR example
        run: python examples/synthetic/fhir_read.py
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
