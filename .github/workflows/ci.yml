name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public release boundary
        run: python scripts/public_release_check.py
      - name: Verify package metadata
        run: python3 scripts/package_metadata.py
      - name: Inspect project
        run: python3 scripts/project_status.py --json
      - name: Inspect generic site plan
        run: python3 scripts/site_plan.py revise_orders
      - name: Run the custom proposer example
        run: python3 examples/synthetic/custom_proposer.py
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
